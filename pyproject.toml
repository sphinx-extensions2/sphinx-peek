[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "sphinx_glimpse"
dynamic = ["version", "description"]
authors = [{name = "Chris Sewell", email = "chrisj_sewell@hotmail.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
keywords = ["sphinx", "extension", "preview", "popover", "tooltip"]
requires-python = ">=3.10"
dependencies = ["sphinx>=7.2"]

[project.urls]
Homepage = "https://github.com/sphinx-extensions2/sphinx-glimpse"
Documentation = "https://sphinx-glimpse.readthedocs.io/"

[project.optional-dependencies]
testing = ["pytest"]
docs = ["furo", "myst-parser"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["B0", "C4", "I", "ICN", "ISC", "N", "RUF", "SIM", "UP"]
extend-ignore = ["ISC001", "RUF009"]

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.mypy]
strict = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["docutils.*"]
ignore_missing_imports = true
